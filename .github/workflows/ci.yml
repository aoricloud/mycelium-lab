name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      # Ni paquet venu d'un registre ou d'un dépôt git, ni .cargo/ (son runner ferait passer cargo test sans test).
      - name: sans dépendance ni .cargo/
        if: runner.os == 'Linux'
        run: |
          test ! -e .cargo
          venus=$(cargo metadata --format-version 1 --locked | jq '[.packages[] | select(.source != null)] | length')
          test "$venus" = 0
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
