[package]
name = "mycelium-lab"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "mycelium"
path = "src/main.rs"

[dependencies]

[features]
default = ["etape-0", "etape-1", "etape-2", "etape-3", "etape-4", "etape-5", "etape-6", "etape-7", "etape-8", "etape-9", "etape-10"]
etape-0 = []
etape-1 = []
etape-2 = []
etape-3 = []
etape-4 = []
etape-5 = []
etape-6 = []
etape-7 = []
etape-8 = []
etape-9 = []
etape-10 = []
etape-11 = []

# Les tests se compilent optimisés : la suite entière passe d'environ 5 minutes à 1 minute 20 (essai du 09/11, sur
# la VM calme), avec les mêmes 455 tests verts, empreintes comprises. Les vérifications de débordement et les
# `debug_assert!` restent actives. Ne pas le changer sans PR à part.
[profile.dev]
opt-level = 3
